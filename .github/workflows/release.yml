name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================================================
  # Stage 1: Test (gate for all subsequent jobs)
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Run tests
      run: make test

    - name: Check code quality
      run: make check

  # ==========================================================================
  # Stage 2: Build binaries in parallel (native compilation = fast)
  # ==========================================================================
  build-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Prepare artifact
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/apollo-air1-exporter dist/
        # Create tarball for GitHub release
        tar -czf dist/apollo-air1-exporter-${{ matrix.arch }}-linux.tar.gz \
          -C target/${{ matrix.target }}/release apollo-air1-exporter

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.arch }}
        path: dist/apollo-air1-exporter
        retention-days: 1

    - name: Upload release tarball
      uses: actions/upload-artifact@v7
      with:
        name: tarball-${{ matrix.arch }}
        path: dist/apollo-air1-exporter-${{ matrix.arch }}-linux.tar.gz
        retention-days: 1

  # ==========================================================================
  # Stage 3: Publish to crates.io (parallel with docker builds)
  # ==========================================================================
  publish-crate:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ==========================================================================
  # Stage 4: Build Docker images per-architecture (using pre-built binaries)
  # This is FAST because no compilation happens - just copying the binary
  # ==========================================================================
  docker-build:
    needs: build-binaries
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Download binary
      uses: actions/download-artifact@v8
      with:
        name: binary-${{ matrix.arch }}
        path: dist/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: dist/
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/apollo-air1-exporter:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          ghcr.io/${{ github.repository_owner }}/apollo-air1-exporter:${{ steps.version.outputs.version }}-${{ matrix.arch }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

  # ==========================================================================
  # Stage 5: Create multi-arch manifest (combines per-arch images)
  # ==========================================================================
  docker-manifest:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Create and push Docker Hub manifest
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        REPO="${{ secrets.DOCKER_USERNAME }}/apollo-air1-exporter"

        docker buildx imagetools create \
          --tag "${REPO}:${VERSION}" \
          "${REPO}:${VERSION}-amd64" \
          "${REPO}:${VERSION}-arm64"

        docker buildx imagetools create \
          --tag "${REPO}:latest" \
          "${REPO}:${VERSION}-amd64" \
          "${REPO}:${VERSION}-arm64"

        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
        docker buildx imagetools create \
          --tag "${REPO}:${MAJOR_MINOR}" \
          "${REPO}:${VERSION}-amd64" \
          "${REPO}:${VERSION}-arm64"

    - name: Create and push GHCR manifest
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        REPO="ghcr.io/${{ github.repository_owner }}/apollo-air1-exporter"

        docker buildx imagetools create \
          --tag "${REPO}:${VERSION}" \
          "${REPO}:${VERSION}-amd64" \
          "${REPO}:${VERSION}-arm64"

        docker buildx imagetools create \
          --tag "${REPO}:latest" \
          "${REPO}:${VERSION}-amd64" \
          "${REPO}:${VERSION}-arm64"

        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
        docker buildx imagetools create \
          --tag "${REPO}:${MAJOR_MINOR}" \
          "${REPO}:${VERSION}-amd64" \
          "${REPO}:${VERSION}-arm64"

  # ==========================================================================
  # Stage 6: Create GitHub Release with binaries
  # ==========================================================================
  release:
    runs-on: ubuntu-latest
    needs: [publish-crate, docker-manifest]
    steps:
    - uses: actions/checkout@v7

    - name: Download all tarballs
      uses: actions/download-artifact@v8
      with:
        pattern: tarball-*
        path: dist/
        merge-multiple: true

    - name: Extract changelog content
      id: changelog
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        # Extract the changelog section for this version
        awk -v heading="## [$VERSION]" '
          index($0, heading) == 1 { found=1; next }
          found && /^## \[/ { exit }
          found && !/^$/ { print }
        ' CHANGELOG.md > release_notes.md

        # If no specific version found, use unreleased section
        if [ ! -s release_notes.md ]; then
          awk '
            /^## \[Unreleased\]/ { found=1; next }
            found && /^## \[/ { exit }
            found && !/^$/ { print }
          ' CHANGELOG.md > release_notes.md
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        body_path: release_notes.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
