name: Dependency health

on:
  schedule:
    - cron: "44 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b015afc2c81f52fbffd862469203c076e32e6edf # v0.14.3
    with:
      langs: rust,docker,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy,rustfmt &&
        rustup default stable &&
        sudo apt-get update &&
        sudo apt-get install -y musl-tools
      validation-command: make check && make docker-build
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
