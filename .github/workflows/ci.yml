name: CI

on:
  push:
    branches: [ main ]
    # Exclude tags - let release.yml handle those
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run tests
      run: make test
    
    - name: Check formatting and lint
      run: make check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v7
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    
    - name: Build release binary
      run: cargo build --release --target x86_64-unknown-linux-musl
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: apollo-air1-exporter
        path: target/x86_64-unknown-linux-musl/release/apollo-air1-exporter

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7

    - name: Download release binary
      uses: actions/download-artifact@v8
      with:
        name: apollo-air1-exporter
        path: dist/
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build Docker image (no push)
      uses: docker/build-push-action@v7
      with:
        context: dist/
        file: ./Dockerfile
        platforms: linux/amd64
        push: false
        load: true
        tags: apollo-air1-exporter:ci-test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker run --rm apollo-air1-exporter:ci-test --help
